version: "3.9"

networks:
  raft-net:
    driver: bridge

services:

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    networks:
      - raft-net
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    volumes:
      - ./gateway:/app
    environment:
      - REPLICA_URLS=http://replica1:4001,http://replica2:4002,http://replica3:4003
      - GATEWAY_PORT=3000
    networks:
      - raft-net
    depends_on:
      - replica1
      - replica2
      - replica3
    restart: unless-stopped

  replica1:
    build: ./replica
    ports:
      - "4001:4001"
    volumes:
      - ./replica:/app
    environment:
      - REPLICA_ID=replica1
      - PORT=4001
      - PEERS=http://replica2:4002,http://replica3:4003
      - GATEWAY_URL=http://gateway:3000
    networks:
      - raft-net
    restart: unless-stopped

  replica2:
    build: ./replica
    ports:
      - "4002:4002"
    volumes:
      - ./replica:/app
    environment:
      - REPLICA_ID=replica2
      - PORT=4002
      - PEERS=http://replica1:4001,http://replica3:4003
      - GATEWAY_URL=http://gateway:3000
    networks:
      - raft-net
    restart: unless-stopped

  replica3:
    build: ./replica
    ports:
      - "4003:4003"
    volumes:
      - ./replica:/app
    environment:
      - REPLICA_ID=replica3
      - PORT=4003
      - PEERS=http://replica1:4001,http://replica2:4002
      - GATEWAY_URL=http://gateway:3000
    networks:
      - raft-net
    restart: unless-stopped
