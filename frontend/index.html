<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Distributed Drawing Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #16213e; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; }
    #status-bar { display: flex; align-items: center; gap: 20px; font-size: 12px; margin-left: auto; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.connected    { background: #1a4731; color: #4ade80; }
    .badge.disconnected { background: #4a1c1c; color: #f87171; }
    .badge.leader       { background: #3b2a00; color: #fbbf24; }
    .toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 20px; background: #16213e; border-bottom: 1px solid #0f3460; flex-shrink: 0; }
    .toolbar label { font-size: 12px; color: #aaa; }
    .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .color-btn.active { border-color: #fff; }
    #brush-size { width: 80px; }
    #clear-btn { margin-left: auto; padding: 4px 14px; background: #c0392b; border: none; border-radius: 6px; color: #fff; font-size: 12px; cursor: pointer; }
    #clear-btn:hover { background: #e74c3c; }
    .main { display: flex; flex: 1; overflow: hidden; }
    #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { background: #fff; cursor: crosshair; display: block; }
    #debug-panel { width: 260px; background: #0f0f23; border-left: 1px solid #0f3460; overflow-y: auto; padding: 14px; font-size: 11px; flex-shrink: 0; }
    #debug-panel h3 { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1e2a40; color: #ccc; }
    .stat-row span:last-child { color: #fbbf24; font-family: monospace; }
    #log-list { margin-top: 14px; max-height: 300px; overflow-y: auto; }
    #log-list h3 { margin-bottom: 8px; }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #1a2235; color: #94a3b8; font-family: monospace; font-size: 10px; word-break: break-all; }
    .log-entry.election { color: #f59e0b; }
    .log-entry.commit   { color: #4ade80; }
    .log-entry.error    { color: #f87171; }
  </style>
</head>
<body>
